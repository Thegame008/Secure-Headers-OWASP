[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "safewebheaders"
version = "8.5.1"
description = "Analizador CLI y GUI local de cabeceras HTTP de seguridad y Content Security Policy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests==2.34.2",
  "colorama==0.4.6",
  "requests-pkcs12==1.27",
]

[project.scripts]
safewebheaders = "safewebheaders.cli:main"
safewebheaders-web = "safewebheaders.web.server:main"

[tool.setuptools]
py-modules = ["mejora"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["safewebheaders*"]

[tool.setuptools.package-data]
"safewebheaders.web.assets" = ["*.html", "*.css", "*.js", "*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
extend-select = ["B", "I"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["SafeWebHeaders-[0-9]", "build", "dist"]
